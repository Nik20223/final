[pytest]
testpaths = tests
# --capture=sys: при перехвате на уровне fd pytest ломает stdin
# дочернего процесса и selenium-manager не может запустить Chrome.
addopts = -ra --capture=sys
markers =
    ui: UI-тесты на Selenium
    api: API-тесты
    smoke: дымовые тесты
    regression: регрессионные тесты
